# public-bar-kit-version: 1.3.1
name: Public example bar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-bar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-bar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIC_BAR_PLAYWRIGHT: "1.55.0"
      PUBLIC_BAR_PYTHON: "3.12.13"
      PUBLIC_BAR_UV: "0.12.17"
      EDGE_INSTALLER_SHA256: >-
        6dac113fdbaab206aa1c152f6c9a7b6ec4affedb4dce443a06e17516086061a9
      CLI_INSTALLER_SHA256: >-
        38c3b93063fbb4b2172bf0d87ea2ef0b7cc72b74c0658b6a8753d60566c9a485
      PUBLIC_BAR_BASE_REF: >-
        ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the example
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.PUBLIC_BAR_UV }}
          enable-cache: true

      - name: Install latest Expanso tools
        env:
          EXPANSO_DISABLEANALYTICS: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/expanso-bin"
          curl -fsSL \
            https://get.expanso.io/edge/install.sh \
            -o "$RUNNER_TEMP/install-edge.sh"
          curl -fsSL \
            https://get.expanso.io/cli/install.sh \
            -o "$RUNNER_TEMP/install-cli.sh"
          echo \
            "$EDGE_INSTALLER_SHA256  $RUNNER_TEMP/install-edge.sh" \
            | sha256sum -c -
          echo \
            "$CLI_INSTALLER_SHA256  $RUNNER_TEMP/install-cli.sh" \
            | sha256sum -c -
          bash "$RUNNER_TEMP/install-edge.sh" \
            --dir "$RUNNER_TEMP/expanso-bin"
          bash "$RUNNER_TEMP/install-cli.sh" \
            --dir "$RUNNER_TEMP/expanso-bin"
          echo "$RUNNER_TEMP/expanso-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/expanso-bin/expanso-edge" version
          "$RUNNER_TEMP/expanso-bin/expanso-cli" version

      - name: Restore Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: >-
            public-bar-playwright-${{ runner.os }}-${{ env.PUBLIC_BAR_PLAYWRIGHT }}-chromium

      - name: Create the browser environment
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: |
          uv python install "$PUBLIC_BAR_PYTHON"
          uv venv \
            --python "$PUBLIC_BAR_PYTHON" \
            "$RUNNER_TEMP/public-bar-venv"
          uv pip install \
            --python "$RUNNER_TEMP/public-bar-venv/bin/python" \
            beautifulsoup4==4.13.5 \
            jsonschema==4.25.1 \
            "playwright==$PUBLIC_BAR_PLAYWRIGHT" \
            pyyaml==6.0.3 \
            rust-just==1.56.0
          if [[ "${{ steps.playwright-browser-cache.outputs.cache-hit }}" \
             != "true" ]]; then
            "$RUNNER_TEMP/public-bar-venv/bin/playwright" \
              install --with-deps chromium
          fi
          npm install \
            --prefix "$RUNNER_TEMP/public-bar-node" \
            --ignore-scripts \
            --no-save \
            axe-core@4.10.3

      - name: Run static then rendered checks
        env:
          PUBLIC_BAR_AXE_PATH: >-
            ${{ runner.temp }}/public-bar-node/node_modules/axe-core/axe.min.js
        run: |
          base_args=()
          if [[ -n "$PUBLIC_BAR_BASE_REF" ]] && \
             [[ "$PUBLIC_BAR_BASE_REF" != \
                "0000000000000000000000000000000000000000" ]]; then
            base_args=(--base-ref "$PUBLIC_BAR_BASE_REF")
          fi
          "$RUNNER_TEMP/public-bar-venv/bin/python" \
            .demo-kit/public-bar.py \
            --repo . \
            --manifest public-bar.toml \
            --report artifacts/public-bar.md \
            --lane all \
            "${base_args[@]}"

      - name: Stop declared services
        if: always()
        run: |
          if [[ -x "$RUNNER_TEMP/public-bar-venv/bin/python" ]]; then
            "$RUNNER_TEMP/public-bar-venv/bin/python" \
              .demo-kit/public-bar.py \
              --repo . \
              --manifest public-bar.toml \
              --teardown-only
          fi

      - name: Upload public-bar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-bar-report
          path: |
            artifacts/public-bar.md
            artifacts/public-bar.json
          if-no-files-found: error
          retention-days: 30
